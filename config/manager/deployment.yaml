apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: machine-api-provider-nico-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: machine-api-provider-nico
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: machine-api-provider-nico
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: machine-api-provider-nico
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - command:
            - /manager
            - --enable-bmh-sync=true
            - --bmh-externally-provisioned=true
            - --bmh-namespace=openshift-machine-api
            - --bmh-credentials-secret-name=nico-credentials
            - --bmh-credentials-secret-namespace=openshift-machine-api
          image: ghcr.io/fabiendupont/machine-api-provider-nvidia-infra-controller:latest
          name: manager
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/nico-root-ca.crt
          volumeMounts:
            - name: nico-root-ca
              mountPath: /etc/ssl/certs/nico-root-ca.crt
              subPath: ca.crt
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
      serviceAccountName: machine-api-provider-nico-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: nico-root-ca
          configMap:
            name: nico-root-ca
