#
# ESO ExternalSecret: syncs BMC credentials from the site Vault into
# openshift-machine-api so Metal3 BMO can authenticate to vbmc-rs Redfish.
#
# Used only when MAPNI runs with --bmh-externally-provisioned=false
# (BMO/Ironic mode). The target Secret name matches the template
# --bmh-bmc-credentials-secret-template=bmc-%s where %s = NICo machine ID.
#
# Depends on:
#   - ESO operator installed (redhat-operators, included in prereqs chart)
#   - ClusterSecretStore "vault-backend" deployed by NICo's infra-site chart
#     (vault.nico-system.svc:8200, AppRole auth, secrets/ KV mount)
#
# Vault rotation propagates automatically: Vault → ESO refresh → BMH credential.
# One ExternalSecret per machine (or use a shared secret if all machines share
# factory-default credentials — common in lab).
#
# Example for a single machine with ID <MACHINE_ID>:
#   target.name: bmc-<MACHINE_ID>   (matches --bmh-bmc-credentials-secret-template=bmc-%s)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bmc-<MACHINE_ID>           # replace <MACHINE_ID> with the NICo machine ID
  namespace: openshift-machine-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend            # ClusterSecretStore created by infra-site chart
    kind: ClusterSecretStore
  target:
    name: bmc-<MACHINE_ID>         # must match fmt.Sprintf(template, machineID)
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: secrets/bmc/default   # factory-default BMC credentials in Vault
        property: username
    - secretKey: password
      remoteRef:
        key: secrets/bmc/default
        property: password
