name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  # Canonical image name (matches Makefile IMAGE_TAG_BASE, config/manager/deployment.yaml,
  # and the OLM bundle/catalog). Uses the repository owner so forks publish under their own
  # namespace, but keeps the short "machine-api-provider-nico" name rather than the repo slug.
  IMAGE_NAME: ${{ github.repository_owner }}/machine-api-provider-nico

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller

      - name: Checkout NVIDIA infra-controller
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/infra-controller
          path: NVIDIA/infra-controller

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: fabiendupont/machine-api-provider-nvidia-ncx-infra-controller/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
