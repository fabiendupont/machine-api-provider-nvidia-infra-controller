name: E2E

on:
  workflow_run:
    workflows: ["Image"]
    types: [completed]

jobs:
  e2e:
    name: E2E Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      KUBECONFIG: /tmp/carbide-e2e-kubeconfig
      NVIDIA_CARBIDE_API_ENDPOINT: http://localhost:8388
      NVIDIA_CARBIDE_KEYCLOAK_URL: http://localhost:8082
      NVIDIA_CARBIDE_API_ENDPOINT_INTERNAL: http://nico-rest-api.nico-rest.svc:8388
      NVIDIA_CARBIDE_KEYCLOAK_URL_INTERNAL: http://keycloak.nico-rest.svc.cluster.local:8082
      IMG: localhost/machine-api-provider-nico:e2e
      GHCR_IMG: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout provider
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: fabiendupont/machine-api-provider-nvidia-infra-controller

      - name: Checkout NVIDIA infra-controller
        uses: actions/checkout@v7
        with:
          repository: NVIDIA/infra-controller
          ref: v2.2.0-rc.2
          path: NVIDIA/infra-controller

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: fabiendupont/machine-api-provider-nvidia-infra-controller/go.mod

      - name: Increase inotify limits
        run: sudo sysctl -w fs.inotify.max_user_instances=512

      - name: Restore NICo image cache
        id: nico-cache
        uses: actions/cache@v4
        with:
          path: /tmp/nico-images.tar
          key: nico-images-v2.2.0-rc.2

      - name: Load cached NICo images
        if: steps.nico-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/nico-images.tar

      - name: Deploy NICo REST stack
        run: make kind-reset
        working-directory: NVIDIA/infra-controller/rest-api
        timeout-minutes: 20
        env:
          KUBECONFIG: ""

      - name: Save NICo images to cache
        if: steps.nico-cache.outputs.cache-hit != 'true'
        run: |
          docker save \
            localhost:5000/nico-rest-api:latest \
            localhost:5000/nico-rest-workflow:latest \
            localhost:5000/nico-rest-site-manager:latest \
            localhost:5000/nico-rest-site-agent:latest \
            localhost:5000/nico-rest-mock-core:latest \
            localhost:5000/nico-rest-db:latest \
            localhost:5000/nico-rest-cert-manager:latest \
            localhost:5000/nico-mcp:latest \
            -o /tmp/nico-images.tar

      - name: Verify NICo API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8388/healthz; then
              echo "API is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "API health check failed"
          exit 1

      - name: Export kubeconfig
        run: kind get kubeconfig --name nico-rest-local > $KUBECONFIG

      # Work around an upstream bug in NICo v2.2.0-rc.2's Helm deploy path:
      # `make kind-reset` runs `helm-deploy-site-agent`, whose conditional
      #   $(if $(filter-out true,$(LOCAL_CORE)),--set envConfig.CORE_GRPC_ADDRESS=...)
      # never fires when LOCAL_CORE is empty (the default), so the site-agent's
      # CORE_GRPC_ADDRESS is left blank. Even setting LOCAL_CORE=false does not
      # help: setup-local.sh then re-applies the ConfigMap client-side and blanks
      # the value back out, fighting Helm's server-side apply. With an empty
      # address the site-agent falls back to a non-existent default core-grpc
      # endpoint ("produced zero addresses"), its Temporal worker never runs the
      # CreateVpcOnSite activity, and every VPC create times out with HTTP 500.
      # Point the site-agent at the in-cluster mock-core directly (mirrors what
      # upstream's own kustomize path does) and restart it.
      - name: Fix site-agent core-grpc address (upstream v2.2.0-rc.2 workaround)
        run: |
          kubectl -n nico-rest patch configmap nico-rest-site-agent-config --type merge \
            -p '{"data":{"CORE_GRPC_ADDRESS":"nico-rest-mock-core:11079","CORE_GRPC_SEC_OPT":"0"}}'
          kubectl -n nico-rest rollout restart statefulset/nico-rest-site-agent
          kubectl -n nico-rest rollout status statefulset/nico-rest-site-agent --timeout=180s

      - name: Install Machine API CRDs
        run: kubectl apply -f config/crd/external/
        working-directory: fabiendupont/machine-api-provider-nvidia-infra-controller

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and load provider image
        run: |
          docker pull $GHCR_IMG
          docker tag $GHCR_IMG $IMG
          kind load docker-image $IMG --name nico-rest-local

      - name: Set Keycloak hostname so token iss matches NICo API expected issuer
        run: |
          kubectl -n nico-rest set env deployment/keycloak \
            KC_HOSTNAME_URL=http://localhost:8082
          kubectl -n nico-rest rollout status deployment/keycloak --timeout=120s

      - name: Assign test-org roles to nico-api service account in Keycloak
        run: |
          # Get master realm admin token
          ADMIN_TOKEN=$(curl -sf http://localhost:8082/realms/master/protocol/openid-connect/token \
            -d "grant_type=password&client_id=admin-cli&username=admin&password=admin" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          # Get service account user ID for nico-api client
          CLIENT_UUID=$(curl -sf -H "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8082/admin/realms/nico-dev/clients?clientId=nico-api" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          SA_USER_ID=$(curl -sf -H "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8082/admin/realms/nico-dev/clients/$CLIENT_UUID/service-account-user" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          # Get role representations for test-org:TENANT_ADMIN and test-org:PROVIDER_ADMIN
          ROLES=$(curl -sf -H "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8082/admin/realms/nico-dev/roles" \
            | python3 -c "
          import sys, json
          roles = json.load(sys.stdin)
          wanted = {'test-org:TENANT_ADMIN', 'test-org:PROVIDER_ADMIN'}
          print(json.dumps([r for r in roles if r['name'] in wanted]))
          ")

          # Assign roles to service account
          curl -sf -X POST -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$ROLES" \
            "http://localhost:8082/admin/realms/nico-dev/users/$SA_USER_ID/role-mappings/realm"
          echo "Assigned test-org roles to nico-api service account"

      - name: Create NICo credentials secret for BMH sync
        run: |
          kubectl create namespace openshift-machine-api --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic nico-credentials \
            --namespace openshift-machine-api \
            --from-literal=endpoint=http://nico-rest-api.nico-rest.svc:8388 \
            --from-literal=orgName=test-org \
            --from-literal=tokenURL=http://keycloak.nico-rest.svc.cluster.local:8082/realms/nico-dev/protocol/openid-connect/token \
            --from-literal=clientId=nico-api \
            --from-literal=clientSecret=nico-local-secret \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy provider controller
        working-directory: fabiendupont/machine-api-provider-nvidia-infra-controller
        run: |
          kubectl apply -f config/manager/namespace.yaml
          kubectl apply -f config/rbac/
          sed -i "s|ghcr.io/fabiendupont/machine-api-provider-nico:latest|$IMG|" \
            config/manager/deployment.yaml
          kubectl apply -f config/manager/
          kubectl wait --for=condition=Available deployment/controller-manager \
            -n machine-api-provider-nico-system --timeout=5m

      - name: Run e2e tests
        run: make test-e2e-live
        working-directory: fabiendupont/machine-api-provider-nvidia-infra-controller

      - name: Dump controller logs on failure
        if: failure()
        run: |
          echo "=== Controller logs ==="
          kubectl logs -l control-plane=controller-manager \
            -n machine-api-provider-nico-system --tail=200
          echo "=== Machine objects ==="
          kubectl get machines.machine.openshift.io -A -o yaml || true

      - name: Dump NICo stack diagnostics on failure
        if: failure()
        run: |
          echo "=== nico-rest pods ==="
          kubectl get pods -n nico-rest -o wide || true
          echo "=== site-agent config (core-grpc / temporal keys) ==="
          kubectl -n nico-rest get configmap nico-rest-site-agent-config \
            -o jsonpath='{.data.CORE_GRPC_ADDRESS}{"\n"}{.data.CORE_GRPC_SEC_OPT}{"\n"}{.data.CLUSTER_ID}{"\n"}{.data.TEMPORAL_SUBSCRIBE_NAMESPACE}{"\n"}{.data.TEMPORAL_SUBSCRIBE_QUEUE}{"\n"}' || true
          echo "=== site-agent logs ==="
          kubectl -n nico-rest logs statefulset/nico-rest-site-agent --tail=200 || true
          echo "=== mock-core logs ==="
          kubectl -n nico-rest logs deployment/nico-rest-mock-core --tail=100 || true
          echo "=== nico-rest-api logs ==="
          kubectl -n nico-rest logs deployment/nico-rest-api --tail=100 || true
          echo "=== temporal pods ==="
          kubectl get pods -n temporal -o wide || true
