image:
  repository: ghcr.io/fabiendupont/machine-api-provider-nvidia-infra-controller
  tag: latest
  pullPolicy: IfNotPresent

# caBundle is the PEM-encoded CA certificate that signed the TLS certificates
# of the Keycloak token endpoint and the NICo REST API endpoint.
# Required when those endpoints use a private CA (self-signed, corporate PKI).
#
# On OpenShift, populate from the ingress operator CA:
#   oc get secret router-ca -n openshift-ingress-operator \
#     -o jsonpath='{.data.tls\.crt}' | base64 -d
#
# On vanilla Kubernetes, use the CA that signed your Keycloak and API server certs.
#
# Leave empty only if the endpoints use a publicly trusted CA (e.g. Let's Encrypt).
caBundle: ""

bmhSync:
  enabled: true
  # Track 1 (default): NICo owns provisioning, BMO is passive inventory.
  # Track 2 (Ironic mode): set to false; requires ESO ExternalSecret per machine.
  externallyProvisioned: false
  namespace: openshift-machine-api
  credentialsSecretName: nico-credentials
  credentialsSecretNamespace: openshift-machine-api
  # fmt template (%s = NICo machine ID) for per-machine BMC credential Secrets.
  # Only used when externallyProvisioned is false.
  bmcCredentialsSecretTemplate: "bmc-%s"

  # ESO integration: when both fields are set, MAPNI creates an ExternalSecret
  # per machine alongside each BareMetalHost (only when externallyProvisioned: false).
  # The ExternalSecret pulls username/password from Vault and delivers them as the
  # bmc-<machineID> Secret that BMO/Ironic uses to authenticate to vbmc-rs Redfish.
  eso:
    # Name of the ESO ClusterSecretStore that can read from Vault
    # (created by the infra-site chart as "vault-backend").
    clusterSecretStoreName: ""
    # Vault KV path holding BMC credentials (e.g. secrets/bmc/default).
    vaultSecretPath: ""
    # How often ESO re-reads the secret from Vault. Default: 1h.
    refreshInterval: "1h"

webhooks:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi
