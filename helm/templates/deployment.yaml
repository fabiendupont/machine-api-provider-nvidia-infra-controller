apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: machine-api-provider-nico
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: machine-api-provider-nico
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: machine-api-provider-nico
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
            - --enable-bmh-sync={{ .Values.bmhSync.enabled }}
            - --bmh-externally-provisioned={{ .Values.bmhSync.externallyProvisioned }}
            - --bmh-namespace={{ .Values.bmhSync.namespace }}
            - --bmh-credentials-secret-name={{ .Values.bmhSync.credentialsSecretName }}
            - --bmh-credentials-secret-namespace={{ .Values.bmhSync.credentialsSecretNamespace }}
            - --bmh-bmc-credentials-secret-template={{ .Values.bmhSync.bmcCredentialsSecretTemplate }}
          {{- if .Values.caBundle }}
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-bundle.crt
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.caBundle }}
          volumeMounts:
            - name: trusted-ca-bundle
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: ca.crt
              readOnly: true
          {{- end }}
      {{- if .Values.caBundle }}
      volumes:
        - name: trusted-ca-bundle
          configMap:
            name: trusted-ca-bundle
      {{- end }}
